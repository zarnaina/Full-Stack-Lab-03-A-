<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Counter and Theme Switcher</title>

    <link rel="stylesheet" href="q4-style.css">
    <script src="q4-app.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Click Counter</h1>
        <div id="count">0</div>
        <div class="counter-buttons">
            <button id="increaseButton">+1</button>
            <button id="decreaseButton">-1</button>
            <button id="resetButton">Reset</button>
        </div>
        <button id="themeButton">Dark Mode</button>
    </div>

</body>
</html>
